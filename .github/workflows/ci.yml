# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — static checks on push and pull requests.
#
# The repo is maintained at zero findings: structure, compose, hooks, and the
# landing page stay conformant. Attribution guard lives in its own workflow.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conformant structure
        run: |
          set -euo pipefail
          for f in README.md LICENSE .env.example web/landing/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              exit 1
            fi
          done
          echo "structure: ok"

      - name: .gitignore covers .env
        run: |
          set -euo pipefail
          if ! grep -q '^\.env' .gitignore; then
            echo "::warning:: .gitignore does not list .env"
          fi

  landing:
    name: Landing page sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Landing sanity
        run: |
          set -euo pipefail
          f=web/landing/index.html
          grep -qi '<title>' "$f" || { echo "::error::landing has no <title>"; exit 1; }
          grep -qi 'og:title' "$f" || { echo "::error::landing has no og:title"; exit 1; }
          echo "landing: ok"

  container:
    name: Container image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the portal image
        run: docker build -t genesis:ci .

      - name: Boot it and answer /api/health
        run: |
          set -euo pipefail
          docker run -d --name genesis-ci -p 3000:3000 -e SESSION_SECRET=ci-only genesis:ci
          for _ in $(seq 1 20); do
            if curl -fsS -m 5 http://127.0.0.1:3000/api/health -o /tmp/health.json; then break; fi
            sleep 3
          done
          cat /tmp/health.json
          # Liveness, the schema/migration path (the DB is opened before this
          # route answers), and the fact that the assisted EIN gate is present.
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"assistedProviders":\["irs"\]' /tmp/health.json

      - name: Container logs
        if: failure()
        run: docker logs genesis-ci || true

  build:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Policy invariants hold against the built catalog
        run: |
          set -euo pipefail
          # The automation boundary is the one thing a release must not get
          # wrong, so assert it here without booting the server. There are three
          # modes now: a step is `requiresHuman` exactly when its provider is
          # human-only, and an *assisted* provider (the IRS) is run by its own
          # provider, gated on the responsible party's attestation.
          node -e "
            const { execSync } = require('node:child_process');
            execSync('npx tsc -p tsconfig.test.json', { stdio: 'inherit' });
            const { STEP_CATALOG } = require('./.test-build/src/lib/workflow/catalog.js');
            const { PROVIDER_POLICY } = require('./.test-build/src/lib/workflow/policy.js');
            const modes = ['automated', 'assisted', 'human'];
            for (const step of STEP_CATALOG) {
              const policy = PROVIDER_POLICY[step.provider];
              if (!policy) throw new Error(step.key + ': no policy for ' + step.provider);
              if (!modes.includes(policy.mode)) {
                throw new Error(step.key + ': ' + step.provider + ' has unknown mode ' + policy.mode);
              }
              if (step.requiresHuman !== (policy.mode === 'human')) {
                throw new Error(
                  step.key + ': ' + step.provider + ' is ' + policy.mode +
                  ' but requiresHuman=' + step.requiresHuman,
                );
              }
            }
            const assisted = STEP_CATALOG.filter(
              (s) => PROVIDER_POLICY[s.provider].mode === 'assisted',
            ).map((s) => s.provider);
            if (assisted.length === 0) throw new Error('no assisted provider: the EIN filing lost its gate');
            console.log(
              'policy: ' + STEP_CATALOG.length + ' steps consistent; assisted: ' + assisted.join(', '),
            );
          "

  # The image a host runs should be a thing CI built from a reviewed commit, not
  # whatever somebody built on their laptop and carried over (the first
  # deployment did exactly that — see docs/Deployment.md). Every merge to `main`
  # publishes `latest` and an immutable `:<short-sha>` tag; a host pins the SHA
  # tag with GENESIS_IMAGE_TAG, and rolls back by pinning the previous one.
  publish:
    name: Publish the image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest and the commit tag
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::7}"
          docker build -t "$image:latest" -t "$image:$short" .
          docker push "$image:latest"
          docker push "$image:$short"
          echo "pushed $image:latest and $image:$short"
